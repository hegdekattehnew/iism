services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: iism
      POSTGRES_PASSWORD: iism
      POSTGRES_DB: iism
    ports:
      - "5432:5432"
    volumes:
      - iism_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  iism_postgres_data:
