name: iism

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: iism
      POSTGRES_PASSWORD: iism
      POSTGRES_DB: iism
    # Non-default host ports so a pre-existing local Postgres/Redis is untouched.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iism -d iism"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
