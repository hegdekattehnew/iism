<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IISM — offline</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #0b1220; color: #e2e8f0; padding: 2rem;
        font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { max-width: 26rem; text-align: center; }
      h1 { font-size: 1.35rem; margin: 0 0 .5rem; }
      p { margin: 0; color: #94a3b8; }
      p + p { margin-top: .75rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline / आप ऑफ़लाइन हैं</h1>
      <p>Pages you have already opened are still available. This one was not saved.</p>
      <p>आपके द्वारा पहले खोले गए पृष्ठ अब भी उपलब्ध हैं। यह पृष्ठ सहेजा नहीं गया था।</p>
    </main>
  </body>
</html>
