[project]
name = "iism"
version = "0.1.0"
description = "Intelligent Integrated Skill Marketplace"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.40",
    # `[email]` pulls in email-validator, which `EmailStr` needs. A hand-written
    # address regex is the classic way to reject valid addresses forever.
    "pydantic[email]>=2.13",
    "pydantic-settings>=2.13",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.31",
    "alembic>=1.19",
    "pgvector>=0.5",
    "redis>=5.3",
    "arq>=0.28",
    "structlog>=25.1",
    "pyjwt>=2.10",
    "pymongo>=4.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "httpx>=0.28",
    "testcontainers[postgres,redis]>=4.9",
    "ruff>=0.14",
    "mypy>=1.14",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations/versions"]

[tool.ruff.lint]
# G/LOG/T20 guard the logging layer. G004 is the one that earns its place:
# an f-string is interpolated before `logging` sees it, so the redaction
# filter gets one opaque blob instead of keys it can match by name. LOG015
# catches root-logger calls, which bypass every per-logger level. T20 catches
# `print()` -- the one bypass the filter structurally cannot cover.
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ASYNC", "G", "LOG", "T20"]

[tool.ruff.lint.per-file-ignores]
# Bilingual seed rows read better on one line than wrapped mid-sentence.
"scripts/seed_skills.py" = ["E501"]
# Operator CLIs, not services. `make seed`, `make import-nsqf` and `make
# evaluate` print progress to stdout and failures to stderr because stdout
# *is* their interface, and none of them runs under a log collector.
# Rendering their output as JSON would make the tools worse to use. T20 is
# right for `api/`, where a print() is exactly the bypass the redaction
# filter exists to close, and wrong here.
"scripts/*.py" = ["T20"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Header() in defaults is the framework's idiom, not a bug.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["testcontainers.*", "arq.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "migrations.*"
ignore_errors = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
# Fixtures and tests must share one loop: the async engine is built lazily on
# first use and asyncpg connections cannot cross event loops.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
