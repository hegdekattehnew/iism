# Weekly, grouped, so an advisory arrives as one reviewable PR rather than as
# a silent vulnerability or a flood. `pip-audit` and `npm audit` in CI catch
# what is already known; this is what keeps the pins from going stale.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    groups:
      web:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
